
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali ✨</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080016;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
  height: 100vh;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.content {
  position: relative;
  z-index: 1;
  top: 25%;
  padding: 20px;
}

.diya {
  font-size: 85px;
  animation: glow 1.5s infinite alternate;
}

h1 {
  font-size: clamp(35px, 8vw, 75px);
  color: #ffd700;
  text-shadow: 0 0 20px orange,
               0 0 40px red;
  animation: glow 1.5s infinite alternate;
}

p {
  font-size: 22px;
  margin-top: 20px;
  color: #ffdfb0;
}

button {
  margin-top: 35px;
  padding: 15px 30px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #ff4500, #ffd700);
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

@keyframes glow {
  from {
    filter: brightness(0.8);
  }
  to {
    filter: brightness(1.5);
  }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="content">
  <div class="diya">🪔</div>

  <h1>HAPPY DIWALI</h1>

  <p>May your life shine like the stars! ✨</p>

  <p>Wishing you happiness, love & prosperity.</p>

  <button onclick="celebrate()">
    🎆 Celebrate Diwali
  </button>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

function celebrate() {
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      createFirework(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.7
      );
    }, i * 250);
  }
}

function createFirework(x, y) {
  const colors = [
    "#ff0040",
    "#ffd700",
    "#00ffff",
    "#ff69b4",
    "#ffffff"
  ];

  for (let i = 0; i < 90; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1;

    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 100,
      color: colors[
        Math.floor(Math.random() * colors.length)
      ]
    });
  }
}

function animate() {
  ctx.fillStyle = "rgba(8, 0, 22, 0.18)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, index) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03;
    p.life--;

    ctx.globalAlpha = p.life / 100;
    ctx.fillStyle = p.color;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();

    if (p.life <= 0) {
      particles.splice(index, 1);
    }
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

animate();

// Automatic fireworks
setInterval(() => {
  createFirework(
    Math.random() * canvas.width,
    Math.random() * canvas.height * 0.65
  );
}, 900);

</script>

</body>
</html>
